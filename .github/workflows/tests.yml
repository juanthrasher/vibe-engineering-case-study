name: E001 tests

on:
  push:
    branches:
      - main
      - "episode/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.14.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Apply migrations
        run: python manage.py migrate --noinput

      - name: Write persistence probe
        run: |
          python manage.py shell -c "from datetime import datetime; from django.utils import timezone; from booking.models import Service, AvailabilitySlot, Booking; service=Service.objects.get(name='Atendimento'); slot=AvailabilitySlot.objects.create(service=service, starts_at=timezone.make_aware(datetime(2030, 1, 1, 10, 0))); Booking.objects.create(slot=slot, customer_name='Persistência', customer_contact='persist@example.test')"

      - name: Read persistence probe in a new process
        run: |
          python manage.py shell -c "from booking.models import Booking; booking=Booking.objects.get(customer_contact='persist@example.test'); assert booking.customer_name == 'Persistência'"

      - name: Run tests
        run: python manage.py test -v 2
